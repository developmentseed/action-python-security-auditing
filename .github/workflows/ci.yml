name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv pip install --system pre-commit==4.2.0
      - run: pre-commit run --all-files --show-diff-on-failure --color=always

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install package and dev dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Run tests
        run: pytest

  security:
    name: Security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Upload SARIF to GitHub code scanning when the audit publishes security events
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # action.yml resolves dependencies at runtime (`uv run --no-project --with`):
      # audit that resolution, as users get it, not the committed dev lock.
      - name: Resolve dependencies as users get them
        run: uv lock --upgrade
      - uses: ./
        with:
          bandit_scan_dirs: src
          package_manager: uv
          comment_on: never #${{ github.event_name == 'pull_request' && 'always' || 'never' }}
