name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly: dependencies resolve fresh, so test and audit what users get now

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The same cooldown as action.yml, so tests and the self-audit resolve what users get.
env:
  UV_EXCLUDE_NEWER: 7 days

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - run: uv pip install --system pre-commit==4.2.0
      - run: pre-commit run --all-files --show-diff-on-failure --color=always

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: Install package and dev dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Run tests
        run: pytest

  security:
    name: Security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Upload SARIF to GitHub code scanning when the audit publishes security events
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      # No committed lock: `uv export` resolves one with the cooldown above, as users get it.
      - uses: ./
        with:
          bandit_scan_dirs: src
          package_manager: uv
          comment_on: never #${{ github.event_name == 'pull_request' && 'always' || 'never' }}
